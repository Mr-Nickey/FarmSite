<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | Flocking Reed's Farm</title>
    <link rel="icon" href="images/logo.webp" type="image/webp">
    <link href="dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-body transition-colors duration-300 bg-farm-light-green text-[#3E2723] dark:bg-gray-900 dark:text-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border-4 border-[#2E4A35]">
        <div class="bg-[#2E4A35] p-6 text-center relative">
            <a href="index.html" class="absolute top-4 left-4 text-yellow-200 hover:text-white text-sm font-bold">← Home</a>
            <h1 class="text-3xl font-handwritten font-bold text-yellow-300">Member Login</h1>
            <p class="text-green-100 text-sm opacity-90 mt-1">Access your flock, bids, and treats!</p>
        </div>

        <div class="p-8">
            <div class="space-y-4">
                <div>
                    <label for="emailInput" class="block text-sm font-bold mb-1 uppercase text-gray-500">Email Address</label>
                    <input type="email" id="emailInput" placeholder="you@example.com" class="w-full border-2 border-gray-200 p-3 rounded-xl text-lg focus:border-[#2E4A35] outline-none dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                </div>
                <div>
                    <label for="passwordInput" class="block text-sm font-bold mb-1 uppercase text-gray-500">Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" class="w-full border-2 border-gray-200 p-3 rounded-xl text-lg focus:border-[#2E4A35] outline-none dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                </div>
                <div id="confirmPasswordContainer" class="hidden">
                    <label for="passwordConfirmInput" class="block text-sm font-bold mb-1 uppercase text-gray-500">Confirm Password</label>
                    <input type="password" id="passwordConfirmInput" placeholder="••••••••" class="w-full border-2 border-gray-200 p-3 rounded-xl text-lg focus:border-[#2E4A35] outline-none dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                </div>

                <div class="flex flex-col gap-3 pt-2">
                    <button onclick="submitForm()" id="authButton" class="w-full bg-[#2E4A35] hover:bg-[#1B2E21] text-white font-bold py-3 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                        Login
                    </button>
                    <button onclick="loginWithGoogle()" type="button" class="w-full bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-bold py-3 rounded-xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.16-7.27c3.2 0 5.22 1.83 5.71 2.94l2.42-2.27C18.72 2.94 15.52 1 12.16 1c-6.09 0-11 4.92-11 11s4.91 11 11 11c6.59 0 10.93-4.48 10.93-10.46c0-.72-.08-1.39-.25-2.04z"/></svg>
                        Login with Google
                    </button>
                </div>

                <div class="text-center mt-4">
                    <a href="#" onclick="toggleMode(event)" id="toggleLink" class="text-sm text-gray-500 hover:text-gray-700 underline">Need an account? Sign Up</a>
                    <span class="text-sm text-gray-400 mx-2">|</span>
                    <a href="#" onclick="forgotPassword(event)" class="text-sm text-gray-400 hover:text-gray-600 underline">Forgot Password?</a>
                </div>
            </div>
        </div>

        <div id="statusMsg" class="hidden bg-yellow-100 text-yellow-800 p-3 text-center text-sm font-bold border-t border-yellow-200"></div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.26.2/pocketbase.umd.min.js"></script>
    <script src="script.js"></script>
    <script>
        const pb = new PocketBase('https://flockingreeds.farm');
        let isLoginMode = true;

        const confirmPasswordContainer = document.getElementById('confirmPasswordContainer');
        const authButton = document.getElementById('authButton');
        const toggleLink = document.getElementById('toggleLink');

        function toggleMode(event) {
            event.preventDefault();
            isLoginMode = !isLoginMode;

            if (isLoginMode) {
                confirmPasswordContainer.classList.add('hidden');
                authButton.innerText = 'Login';
                authButton.classList.remove('bg-[#D84315]', 'hover:bg-[#BF360C]');
                authButton.classList.add('bg-[#2E4A35]', 'hover:bg-[#1B2E21]');
                toggleLink.innerText = 'Need an account? Sign Up';
            } else {
                confirmPasswordContainer.classList.remove('hidden');
                authButton.innerText = 'Create Account';
                authButton.classList.remove('bg-[#2E4A35]', 'hover:bg-[#1B2E21]');
                authButton.classList.add('bg-[#D84315]', 'hover:bg-[#BF360C]');
                toggleLink.innerText = 'Have an account? Login';
            }
        }

        function submitForm() {
            if (isLoginMode) {
                performLogin();
            } else {
                createAccount();
            }
        }

        function showMsg(msg, isError = false) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.className = isError 
                ? "bg-red-100 text-red-800 p-3 text-center text-sm font-bold border-t border-red-200 block" 
                : "bg-green-100 text-green-800 p-3 text-center text-sm font-bold border-t border-green-200 block";
        }

        function setLoading(btn, text) {
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">${text}</span>`;
        }

        function resetButton(btn, originalText) {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }

        async function performLogin() {
            const btn = document.getElementById('authButton');
            const originalText = btn.innerHTML;
            setLoading(btn, 'Logging in...');

            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (!email || !pass) {
                showMsg("Email and password are required.", true);
                resetButton(btn, originalText);
                return;
            }

            try {
                const authData = await pb.collection('users').authWithPassword(email, pass);
                
                // On success, PocketBase JS SDK automatically saves auth data to localStorage
                showMsg("Success! Redirecting...", false);
                window.location.href = "dashboard.html";

            } catch (e) {
                showMsg("Login Failed: " + e.message, true);
                resetButton(btn, originalText);
            }
        }

        async function loginWithGoogle() {
            try {
                // This will trigger the OAuth2 popup flow
                const authData = await pb.collection('users').authWithOAuth2({ provider: 'google' });
                showMsg("Success! Redirecting...", false);
                window.location.href = "dashboard.html";
            } catch (e) {
                showMsg("Google Login Failed: " + e.message, true);
            }
        }

        async function createAccount() {
            const btn = document.getElementById('authButton');
            const originalText = btn.innerHTML;
            setLoading(btn, 'Creating Account...');

            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const passwordConfirm = document.getElementById('passwordConfirmInput').value;

            if (!email || !password || !passwordConfirm) {
                showMsg("Please fill out all fields.", true);
                resetButton(btn, originalText);
                return;
            }

            if (password !== passwordConfirm) {
                showMsg("Passwords do not match.", true);
                resetButton(btn, originalText);
                return;
            }

            try {
                const data = { email, password, passwordConfirm };
                const record = await pb.collection('users').create(data);

                // Optional: request verification
                await pb.collection('users').requestVerification(email);

                showMsg("Account created! Please check your email to verify your account before logging in.", false);
                resetButton(btn, originalText);

            } catch (e) {
                showMsg("Sign Up Failed: " + e.message, true);
                resetButton(btn, originalText);
            }
        }

        async function forgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            if (!email) {
                showMsg("Please enter your email address in the field above to reset your password.", true);
                return;
            }

            try {
                await pb.collection('users').requestPasswordReset(email);
                showMsg("Password reset email sent! Check your inbox.", false);
            } catch (e) {
                showMsg("Error: " + e.message, true);
            }
        }
    </script>
</body>
</html>
