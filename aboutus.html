    <nav class="bg-[#2E4A35] text-white sticky top-0 z-50 shadow-xl border-b-8 border-[#5D4037]">
        <div class="container mx-auto px-4 py-2 flex flex-col sm:flex-row justify-between items-center gap-4">
            
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="images/logo.png" alt="The Flocking Reed's Farm Logo - Chicken and Goose" class="navbar-logo">
                <span class="font-handwritten text-2xl text-yellow-100 group-hover:text-white transition">The Flocking Reed's</span>
            </a>

            <div class="flex items-center gap-6 text-sm sm:text-base font-bold tracking-wide flex-wrap justify-center">

                <a href="donate.html" class="bg-[#D97706] hover:bg-[#B45309] text-white border-2 border-[#92400E] py-2 px-5 rounded-lg shadow-xl transform hover:scale-105 transition flex items-center active:scale-95 text-xs gap-1 font-semibold">
                    Feed The Flock
                </a>            </div>
        </div>
    </nav>

    <main id="main-content" class="container mx-auto px-4 py-12 flex-grow">
        <section class="bg-[#FEF9E7] p-8 rounded-xl shadow-lg border-4 border-[#8D6E63] max-w-4xl mx-auto dark:bg-gray-800 dark:border-gray-600">
            <h1 class="font-handwritten text-5xl font-bold text-[#2E4A35] mb-4 text-center dark:text-green-400">About Us</h1>
            <p class="text-lg text-[#5D4037] dark:text-gray-300 text-center">

            </p>
        </section>
    </main>

    <footer class="text-center py-8 text-[#A1887F] text-sm bg-[#3E2723] border-t-8 border-[#5D4037] dark:bg-black dark:border-gray-800">

            <p class="mb-2 text-yellow-100/80">© 2026 The Flocking Reed's Farm. All Rights Reserved.</p>
            <div class="flex justify-center gap-4 text-xs font-semibold text-yellow-200/60">
                <a href="index.html" class="hover:text-white">Home</a> | 
                <a href="aboutus.html" class="hover:text-white">About Us</a> |
                <a href="privacy.html" class="hover:text-white">Privacy</a> | 
                <a href="vision.html" class="hover:text-white">Vision</a>
            </div>
            <div class="flex justify-center gap-4 text-xs font-semibold mt-4">
                <button onclick="toggleDyslexiaMode()" class="footer-button" title="Toggle Dyslexia-friendly Font">
                    Toggle Dyslexia Font
                </button>
            </div>
        </div>
    </footer>

    <script>
        if (localStorage.getItem('dyslexiaMode') === 'on') { document.body.classList.add('dyslexia-mode'); }
        function toggleDyslexiaMode() {
            document.body.classList.toggle('dyslexia-mode');
            localStorage.setItem('dyslexiaMode', document.body.classList.contains('dyslexia-mode') ? 'on' : 'off');
        }
    </script>
</body>
