<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Roost Preview</title>
    <link href="dist/output.css" rel="stylesheet">
</head>
<body class="font-body bg-gray-100 p-8">
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="p-8">
            <h1 id="previewSubject" class="text-3xl font-bold mb-4">The Roost Preview</h1>
            <div id="previewBody" class="prose max-w-none"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const subject = sessionStorage.getItem('newsletterPreviewSubject');
            const body = sessionStorage.getItem('newsletterPreviewBody');

            if (subject) {
                document.getElementById('previewSubject').textContent = subject;
            }
            if (body) {
                document.getElementById('previewBody').innerHTML = body;
            }

            // Clear the session storage after displaying the preview
            sessionStorage.removeItem('newsletterPreviewSubject');
            sessionStorage.removeItem('newsletterPreviewBody');
        });
    </script>
</body>
</html>
