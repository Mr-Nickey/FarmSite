<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - The Flocking Reed's</title>
    
    <link rel="icon" href="images/logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'media' } </script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100 flex flex-col min-h-screen">

    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-yellow-500 text-black p-2 rounded z-50">Skip to Content</a>

    <nav class="bg-[#2E4A35] text-white sticky top-0 z-50 shadow-xl border-b-8 border-[#5D4037]">
        <div class="container mx-auto px-4 py-2 flex flex-col sm:flex-row justify-between items-center gap-4">
            
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="images/logo.png" alt="The Flocking Reed's Farm Logo - Chicken and Goose" class="navbar-logo">
                <span class="font-handwritten text-2xl text-yellow-100 group-hover:text-white transition">The Flocking Reed's</span>
            </a>

            <div class="flex items-center gap-6 text-sm sm:text-base font-bold tracking-wide flex-wrap justify-center">
                <a href="index.html" class="nav-tab-home transition py-2 border-b-2 border-transparent text-green-200">Home</a>
                <a href="vision.html" class="nav-tab-vision transition py-2 border-b-2 border-transparent text-blue-200">Vision</a>
                
                <a href="donate.html" class="bg-[#8D6E63] hover:bg-[#A1887F] text-yellow-100 border-2 border-[#5D4037] py-2 px-5 rounded-lg shadow-md transform hover:scale-105 transition flex items-center gap-2">
                    <span>🎁</span> Donate
                </a>

                <button onclick="toggleDyslexiaMode()" class="bg-black/20 hover:bg-black/40 text-white p-2 rounded-full transition" title="Dyslexia Font">
                    👁️
                </button>
            </div>
        </div>
    </nav>

    <main id="main-content" class="container mx-auto px-4 py-12 text-center flex-grow flex flex-col justify-center items-center">
        
        <h1 class="font-handwritten text-6xl font-bold text-red-700 mb-4 dark:text-red-400">Uh Oh!</h1>
        <p class="text-2xl text-[#3E2723] mb-8 dark:text-gray-300">We can't find that page. The chickens must have hidden it.</p>
        
        <img src="images/404.png" alt="Confused Chicken" class="cute-frame w-full max-w-sm mb-8 transform -rotate-2">
        
        <div class="flex flex-col gap-4">
            <a href="index.html" class="inline-block bg-[#FACC15] hover:bg-yellow-400 text-green-900 font-bold text-xl py-3 px-8 rounded-full shadow-lg border-b-4 border-yellow-600 transition transform hover:scale-105">
                Go Back Home
            </a>
            <a href="index.html#contact" class="text-sm text-[#5D4037] underline hover:text-[#2E4A35] dark:text-gray-400">
                Report a missing page
            </a>
        </div>

    </main>

    <footer class="text-center py-8 text-[#A1887F] text-sm bg-[#3E2723] border-t-8 border-[#5D4037] dark:bg-black dark:border-gray-800">
        <div class="container mx-auto px-4">
            <p class="mb-2 text-yellow-100/80">© 2026 The Flocking Reed's Farm. All Rights Reserved.</p>
            <div class="flex justify-center gap-4 text-xs font-semibold text-yellow-200/60">
                <a href="index.html" class="hover:text-white">Home</a> | 
                <a href="privacy.html" class="hover:text-white">Privacy</a> | 
                <a href="vision.html" class="hover:text-white">Vision</a>
            </div>
        </div>
    </footer>

    <script>
        if (localStorage.getItem('dyslexiaMode') === 'on') { document.body.classList.add('dyslexia-mode'); }
        function toggleDyslexiaMode() {
            document.body.classList.toggle('dyslexia-mode');
            localStorage.setItem('dyslexiaMode', document.body.classList.contains('dyslexia-mode') ? 'on' : 'off');
        }
    </script>
</body>
</html>
