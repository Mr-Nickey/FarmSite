<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <script>
      // Prevents FOUC (flash of unstyled content) in dark mode
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <link href="dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* App Mode Overrides */
        body { margin-top: 0 !important; }
        @media (max-width: 640px) {
            .p-4 { padding: 0.75rem !important; } /* Tighten widget padding */
        }
        @media print {
            @page { margin: 0.5cm; size: landscape; }
            body { background: white !important; color: black !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
            nav, footer, #newsAlert { display: none !important; }

            /* Default print hides everything but the active widget */
            body.is-printing main > div:not(.printable-widget) { display: none !important; }
            
            .printable-widget { 
                position: static !important; 
                width: 100% !important; 
                box-shadow: none !important; 
                border: none !important; 
                overflow: visible !important; 
                height: auto !important; 
            }

            .no-print, button { display: none !important; }
            input, select { border: none !important; background: transparent !important; appearance: none; padding: 0; color: black !important; }
            ::placeholder { color: transparent; }
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #ccc; padding: 4px; }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            80%, 100% { transform: scale(2); opacity: 0; }
        }
        .pulse-ring-animation {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<div id="newsAlert" class="hidden bg-yellow-600 text-white text-center py-2 px-4 font-bold font-handwritten text-lg shadow-md animate-pulse"></div>
<body class="font-body transition-colors duration-300 bg-farm-light-green text-[#3E2723] dark:bg-gray-900 dark:text-gray-100 flex min-h-screen">

    <!-- Sidebar container -->
    <div id="sidebar-container" class="flex-shrink-0"></div>

    <!-- Main content area -->
    <div class="flex-grow flex flex-col overflow-y-auto">

        <!-- Full-screen loading overlay -->
        <div id="loadingOverlay" class="fixed inset-0 z-[10000] bg-black/50 backdrop-blur-sm flex items-center justify-center hidden">
            <div class="text-white text-2xl animate-pulse font-bold">🔄 Syncing Farm Data...</div>
        </div>

        <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-yellow-500 text-black p-2 rounded z-50">Skip to Content</a>

        <main id="main-content" class="container mx-auto px-2 sm:px-4 mt-4 sm:mt-8 max-w-4xl space-y-4 sm:space-y-8 grow">

            <div class="rounded-lg shadow-lg overflow-hidden bg-white dark:bg-gray-800">
                <div class="bg-indigo-600 p-3 text-white font-bold">📢 The Roost Updates</div>
                <div class="p-4">
                    <div class="flex gap-2">
                        <input type="text" id="newsInput" class="flex-1 border p-2 rounded dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200" placeholder="Alerts...">
                        <button id="saveNewsBtn" class="bg-blue-600 text-white px-6 rounded font-bold hover:bg-blue-700 active:scale-95 transition">Save</button>
                    </div>
                </div>
            </div>

        <!-- Newsletter Widget -->
        <div class="rounded-lg shadow-lg overflow-hidden bg-white dark:bg-gray-800">
            <div class="bg-cyan-700 p-3 text-white font-bold flex justify-between items-center">
                <span>📢 Newsletter Center</span>
                <span id="newsletterSubCount" class="text-xs bg-black/20 px-2 py-1 rounded">0 Subscribers</span>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label for="newsletterSubject" class="text-sm font-bold text-gray-500 dark:text-gray-400">Subject Line</label>
                    <input type="text" id="newsletterSubject" class="w-full border p-2 rounded dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 mt-1" placeholder="Your amazing newsletter subject...">
                </div>
                <div>
                    <label class="text-sm font-bold text-gray-500 dark:text-gray-400">Content</label>
                    <div id="editor" class="mt-1 bg-white dark:bg-gray-700 dark:text-white" style="height: 250px;"></div>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button id="newBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition">New</button>
                    <div class="flex gap-3">
                        <button id="previewBtn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition">Preview</button>
                        <button id="saveDraftBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition">Save Draft</button>
                        <button id="sendNewsletterBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition">🚀 Send to All</button>
                    </div>
                </div>
            </div>
             <div class="border-t dark:border-gray-700 p-4">
                <h3 class="font-bold text-lg mb-2">Sent History</h3>
                <div id="sentNewslettersList" class="space-y-4 max-h-96 overflow-y-auto">
                    <!-- Sent newsletters will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Farm Blog Posts Widget -->
        <div class="rounded-lg shadow-lg overflow-hidden bg-white dark:bg-gray-800">
            <div class="bg-purple-700 p-3 text-white font-bold flex justify-between items-center">
                <span>📝 Farm Blog Posts</span>
                <button id="createPostBtn" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-1 px-3 rounded-lg transition text-sm">Create New Post</button>
            </div>
            <div class="p-4">
                <table class="w-full text-left">
                    <thead class="border-b-2 dark:border-gray-700">
                        <tr>
                            <th class="p-2">Title</th>
                            <th class="p-2">Date</th>
                            <th class="p-2">Status</th>
                            <th class="p-2">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="blogPostsList">
                        <!-- Blog posts will be rendered here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Generic Modal -->
    <div id="appModal" class="fixed inset-0 bg-black/80 z-[70] items-center justify-center p-4 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b dark:border-gray-700 shrink-0">
                <h3 id="modalTitle" class="font-bold text-xl text-gray-800 dark:text-white">Modal Title</h3>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto">
                <!-- Content from JS will be injected here -->
            </div>
            <div class="p-6 border-t dark:border-gray-700 shrink-0 flex justify-end gap-3">
                <button id="modalCancel" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-6 py-2 rounded-lg font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition">Cancel</button>
                <button id="modalConfirm" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 z-[9999] bg-gray-900 flex items-center justify-center p-4">
        <div class="bg-[#FEF9E7] dark:bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border-4 border-[#2E4A35] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-[#2E4A35]"></div>
            <div class="mb-4">
                <div class="w-16 h-16 bg-[#2E4A35] rounded-full flex items-center justify-center mx-auto shadow-lg">
                    <span class="text-3xl">🔐</span>
                </div>
            </div>
            <h2 class="text-3xl font-handwritten font-bold mb-2 text-[#2E4A35] dark:text-green-400">FarmOS Admin</h2>
            <p class="text-xs font-bold text-red-600 dark:text-red-400 uppercase tracking-widest mb-6 border-b-2 border-red-200 inline-block pb-1">Superuser Access Only</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-xs font-bold text-[#5D4037] dark:text-gray-400 uppercase ml-1">Superuser Email</label>
                    <input type="email" id="adminEmail" placeholder="email@example.com" class="w-full border-2 border-[#A1887F] p-3 rounded-xl bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:border-[#2E4A35] outline-none transition-colors">
                </div>
                <div>
                    <label class="text-xs font-bold text-[#5D4037] dark:text-gray-400 uppercase ml-1">Password</label>
                    <input type="password" id="adminPass" placeholder="••••••••" class="w-full border-2 border-[#A1887F] p-3 rounded-xl bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:border-[#2E4A35] outline-none transition-colors">
                </div>
            </div>

            <button class="w-full bg-[#2E4A35] hover:bg-[#1B2E21] text-white font-bold py-4 rounded-xl mt-6 shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2">
                <span>Authenticate</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            </button>
            <p class="text-[10px] text-gray-400 mt-4">Secure Connection • 256-bit Encryption</p>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.26.2/pocketbase.umd.min.js"></script>
    <script src="script.js"></script>
    <script type="module">
        import { initSidebar } from './js/admin/sidebar.js';
        import { initTheRoost } from './js/admin/theroost.js';
        import { initBlog } from './js/admin/blog.js';

        const pb = new PocketBase('https://flockingreeds.farm');
        pb.authStore.storageKey = 'pb_admin_auth';
        pb.autoCancellation(false);

        const sidebarContainer = document.getElementById('sidebar-container');
        const loginModal = document.getElementById('loginModal');
        const loginButton = document.querySelector('#loginModal button');
        const adminEmail = document.getElementById('adminEmail');
        const adminPass = document.getElementById('adminPass');

        // Always initialize the sidebar for consistent layout
        initSidebar(sidebarContainer, 'cms.html', pb);

        // Basic Auth Check
        if (pb.authStore.isValid && pb.authStore.isSuperuser) {
            loginModal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');

            // Initialize page-specific modules
            initTheRoost(pb);
            initBlog(pb);

        } else {
            // Show login
            loginModal.classList.remove('hidden');
        }

        // Add login handler
        if (loginButton) {
            loginButton.addEventListener('click', async () => {
                const email = adminEmail.value;
                const pass = adminPass.value;
                
                if (!email || !pass) {
                    alert("Please enter both email and password.");
                    return;
                }

                loginButton.disabled = true;
                loginButton.innerHTML = `<span class="animate-pulse">Verifying...</span>`;

                try {
                    await pb.admins.authWithPassword(email, pass);
                    window.location.reload(); // Reload the page on successful login
                } catch (e) {
                    console.error(e);
                    alert("Authentication Failed: " + (e.message || "Invalid credentials"));
                    loginButton.disabled = false;
                    loginButton.textContent = 'Authenticate';
                }
            });
        }
    </script>
</body>
</html>
